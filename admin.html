
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Lava-Jato Palmares</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f4f4f9;
            color: #222;
        }

        .container {
            width: min(100% - 24px, 760px);
            margin: 32px auto;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        #loginArea {
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 13px 16px;
            border: 0;
            border-radius: 6px;
            background: #075bb5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #06488e;
        }

        #loginButton {
            width: 100%;
        }

        #message {
            min-height: 24px;
            margin-top: 14px;
            color: #444;
            overflow-wrap: anywhere;
        }

        #painel {
            display: none;
        }

        .cabecalho-painel {
            padding-bottom: 18px;
            border-bottom: 1px solid #ddd;
        }

        .cabecalho-painel p {
            margin-bottom: 0;
            color: #555;
        }

        .grade-botoes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 22px;
        }

        .grade-botoes button {
            min-height: 62px;
            background: #075bb5;
        }

        .aviso {
            margin-top: 20px;
            padding: 13px;
            border-radius: 6px;
            background: #fff3cd;
            color: #664d03;
            line-height: 1.5;
        }

        @media (max-width: 520px) {
            .container {
                margin: 16px auto;
                padding: 20px;
            }

            .grade-botoes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section id="loginArea">
            <h1>Acesso restrito</h1>
            <p>Digite o e-mail de administrador para receber o link de acesso.</p>

            <input
                type="email"
                id="emailInput"
                placeholder="E-mail do administrador"
                autocomplete="email"
            >

            <button type="button" id="loginButton" onclick="enviarLink()">
                Enviar link mágico
            </button>

            <div id="message" role="status" aria-live="polite"></div>
        </section>

        <section id="painel">
            <div class="cabecalho-painel">
                <h1>Painel administrativo</h1>
                <p>Acesso liberado. Escolha uma área:</p>
            </div>

            <div class="grade-botoes">
                <button type="button">Agendamentos</button>
                <button type="button">Clientes mensalistas</button>
                <button type="button">Veículos</button>
                <button type="button">Lavagens e histórico</button>
                <button type="button">Pagamentos</button>
                <button type="button">Planos e preços</button>
            </div>

            <div class="aviso">
                Estas áreas são apenas a estrutura inicial. Ainda não estão conectadas a dados.
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            sendSignInLinkToEmail,
            isSignInWithEmailLink,
            signInWithEmailLink,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOnB_h4X_2qWjiw5fSuK8w0i8e_NAXByY",
            authDomain: "lava-jato-palmares-b-a-093.firebaseapp.com",
            projectId: "lava-jato-palmares-b-a-093",
            storageBucket: "lava-jato-palmares-b-a-093.firebasestorage.app",
            messagingSenderId: "170054342057",
            appId: "1:170054342057:web:f86f0794a66a4cae06a0b8",
            measurementId: "G-4SDYN56CNQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const adminEmail = "lavajatopalmares375@gmail.com";

        const actionCodeSettings = {
            url: "https://ccn-3-7-5.github.io/Lava-jato-palmares-B-A-093/admin.html",
            handleCodeInApp: true
        };

        const message = document.getElementById("message");

        window.enviarLink = async function() {
            const email = document
                .getElementById("emailInput")
                .value
                .trim()
                .toLowerCase();

            if (email !== adminEmail) {
                message.textContent = "Acesso negado. Use o e-mail autorizado.";
                return;
            }

            message.textContent = "Enviando o link…";

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                localStorage.setItem("emailForSignIn", email);
                message.textContent = "Link enviado. Confira sua caixa de entrada.";
            } catch (error) {
                message.textContent = "Não foi possível enviar o link: " + error.message;
            }
        };

        async function concluirLoginPorLink() {
            if (!isSignInWithEmailLink(auth, window.location.href)) {
                return;
            }

            let email = localStorage.getItem("emailForSignIn");

            if (!email) {
                email = window.prompt("Digite o mesmo e-mail em que recebeu o link:");
            }

            if (!email) {
                message.textContent = "Login cancelado. Abra novamente o link recebido.";
                return;
            }

            email = email.trim().toLowerCase();

            try {
                const resultado = await signInWithEmailLink(
                    auth,
                    email,
                    window.location.href
                );

                localStorage.removeItem("emailForSignIn");

                if (resultado.user.email?.toLowerCase() !== adminEmail) {
                    await signOut(auth);
                    message.textContent = "Acesso negado. Este e-mail não é de administrador.";
                    return;
                }

                document.getElementById("loginArea").style.display = "none";
                document.getElementById("painel").style.display = "block";

                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (error) {
                message.textContent = "Erro ao entrar: " + error.message;
            }
        }

        concluirLoginPorLink();
    </script>
</body>
</html>
