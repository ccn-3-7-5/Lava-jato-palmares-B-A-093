<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Lava-Jato Palmares</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; color: red; font-weight: bold; }
        #painel { display: none; margin-top: 20px; padding: 20px; background: #d4edda; color: #155724; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div id="telaLogin">
            <h2>Acesso Administrativo</h2>
            <p>Digite seu e-mail e senha mestre.</p>
            
            <input type="email" id="emailInput" placeholder="Seu e-mail de admin">
            <input type="password" id="senhaInput" placeholder="Sua senha mestre">
            <button onclick="verificarLogin()">Entrar no Painel</button>
            
            <div id="message"></div>
        </div>

        <div id="painel">
            <h3>Bem-vindo, Administrador!</h3>
            <p>Aqui você vai colocar os links do seu painel (Planos, Clientes, Agendamentos, etc).</p>
            <button onclick="sair()" style="background-color: #dc3545; margin-top: 20px;">Sair</button>
        </div>
    </div>

    <script>
        // AQUI VOCÊ DEFINE O SEU E-MAIL E A SUA SENHA MESTRE
        const EMAIL_ADMIN = "lavajotapalmares375@gmail.com";
        const SENHA_MESTRE = "lava123";

        window.verificarLogin = function() {
            const email = document.getElementById('emailInput').value;
            const senha = document.getElementById('senhaInput').value;

            // Verifica se o e-mail e a senha estão corretos
            if (email === EMAIL_ADMIN && senha === SENHA_MESTRE) {
                document.getElementById('telaLogin').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
            } else {
                document.getElementById('message').innerText = "E-mail ou senha incorretos.";
            }
        };

        window.sair = function() {
            document.getElementById('telaLogin').style.display = 'block';
            document.getElementById('painel').style.display = 'none';
            document.getElementById('emailInput').value = '';
            document.getElementById('senhaInput').value = '';
            document.getElementById('message').innerText = '';
        };
    </script>
</body>
</html>
